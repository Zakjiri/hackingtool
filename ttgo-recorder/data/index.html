<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCamera Recorder</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>TCamera Recorder</h1>
    <p id="deviceName">Loading...</p>
  </header>
  <main>
    <section>
      <h2>Status</h2>
      <div id="status">
        <p>Recording: <span id="recState">no</span></p>
        <p>Record time: <span id="recTime">0</span> s</p>
        <p>Audio Stream: <span id="audioStreamState">off</span></p>
        <p>Video Stream: <span id="videoStreamState">off</span></p>
        <p>Battery: <span id="battery">--</span></p>
        <p>Wi-Fi IP: <span id="wifiIp">--</span></p>
        <p>AP IP: <span id="apIp">--</span></p>
        <p>SD Card: <span id="sdState">--</span></p>
      </div>
      <div class="buttons">
        <button data-action="start-audio">Start Audio Recording</button>
        <button data-action="stop-audio">Stop Audio Recording</button>
        <button data-action="photo">Take Photo</button>
      </div>
      <div class="buttons">
        <button data-action="start-audio-stream">Start Audio Streaming</button>
        <button data-action="stop-audio-stream">Stop Audio Streaming</button>
        <button data-action="start-video-stream">Start Video Streaming</button>
        <button data-action="stop-video-stream">Stop Video Streaming</button>
      </div>
      <audio id="audioPlayer" controls></audio>
      <img id="photoPreview" alt="Latest Snapshot" />
      <img id="videoStream" alt="Video Stream" />
    </section>

    <section>
      <h2>Files</h2>
      <div class="tabs">
        <button data-list="audio">Audio</button>
        <button data-list="photo">Photos</button>
      </div>
      <ul id="fileList"></ul>
    </section>

    <section>
      <h2>Settings</h2>
      <form id="settingsForm">
        <label>Device Name <input type="text" name="device_name" required /></label>
        <label>Wi-Fi SSID <input type="text" name="wifi_ssid" /></label>
        <label>Wi-Fi Password <input type="password" name="wifi_password" /></label>
        <label>VOX Threshold <input type="number" name="vox_threshold" min="0" max="4000" /></label>
        <label>NTP Server <input type="text" name="ntp_server" /></label>
        <label>Timezone Offset (minutes) <input type="number" name="timezone_offset" /></label>
        <button type="submit">Save</button>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
